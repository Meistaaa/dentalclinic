databases:
  - name: dentalclinic-db
    databaseName: dentalclinic
    plan: free

services:
  - type: web
    name: dentalclinic-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      # Node 22.18+ runs .ts directly via native type stripping; no build step.
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: dentalclinic-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Set to the static site's public URL once it exists (no wildcards).
      - key: CORS_ORIGIN
        sync: false
      - key: CSRF_SECRET
        generateValue: true

  - type: web
    name: dentalclinic-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https:; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
